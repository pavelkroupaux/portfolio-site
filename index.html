<!-- Lock screen. Everything below is ciphertext until the password derives the key. -->
<main id="gate" class="gate">
  <div class="gate__inner">
    <p class="gate__eyebrow">Private</p>
    <h1 class="gate__title">This work is<br><em>behind a password.</em></h1>
    <p class="gate__note">If you were sent here, you have the password. If you do not, write to me and I will send it.</p>

    <form id="gate-form" class="field" autocomplete="off" novalidate>
      <label class="field__label" for="password">Password</label>
      <div class="field__row">
        <input
          id="password"
          class="field__input"
          type="password"
          name="password"
          autocomplete="current-password"
          spellcheck="false"
          autocapitalize="none"
          required>
        <button id="gate-submit" class="field__go" type="submit" aria-label="Unlock">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <p id="gate-message" class="field__message" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
